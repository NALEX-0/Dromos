name: Render PlantUML diagrams

on:
  push:
    paths:
      - "docs/diagrams/src/**/*.puml"
      - ".github/workflows/render-plantuml.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-plantuml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install --yes plantuml

      - name: Render SVG diagrams
        run: |
          rm -f docs/diagrams/rendered/*.svg
          plantuml -tsvg -o ../rendered docs/diagrams/src/*.puml

      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/rendered
          git diff --cached --quiet && exit 0
          git commit -m "docs: render PlantUML diagrams"
          git push
