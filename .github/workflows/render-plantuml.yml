name: Render PlantUML diagrams

on:
  push:
    paths:
      - "docs/diagrams/src/**/*.puml"
      - ".github/workflows/render-plantuml.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-plantuml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download PlantUML
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/plantuml.jar" \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.6/plantuml-1.2026.6.jar
          echo "89948f14c93756c7a3fb7b69078ff37e8489fd79dd430c582b931e2f65358690  $RUNNER_TEMP/plantuml.jar" \
            | sha256sum --check --strict

      - name: Render SVG diagrams
        run: |
          rm -f docs/diagrams/rendered/*.svg
          java -Djava.awt.headless=true -jar "$RUNNER_TEMP/plantuml.jar" \
            -tsvg -o ../rendered docs/diagrams/src/*.puml

      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/rendered
          git diff --cached --quiet && exit 0
          git commit -m "docs: render PlantUML diagrams"
          git push
