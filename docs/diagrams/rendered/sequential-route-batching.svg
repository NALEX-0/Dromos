<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="954px" preserveAspectRatio="none" style="width:725px;height:954px;background:#FFFFFF;" version="1.1" viewBox="0 0 725 954" width="725px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="478.625" x="122.5874" y="32.9951">Dromos - Sequential route batching (up to 100 destinations)</text></g><ellipse cx="202.2275" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="307.5957" x="48.4297" y="92.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="287.5957" x="58.4297" y="113.4355">Validate start, ordered destinations and options</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="295.6953" x="54.3799" y="146.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="275.6953" x="64.3799" y="167.4043">Geocode addresses through CachedGeocoder</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="256.7598" x="73.8477" y="200.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.7598" x="83.8477" y="221.373">Build point list in the user's exact order</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="221.5273" x="91.4639" y="302.6055"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.5273" x="101.4639" y="323.7441">Append the start point to the end</text><polygon fill="#F1F1F1" points="158.8855,254.2031,245.5696,254.2031,257.5696,266.2031,245.5696,278.2031,158.8855,278.2031,146.8855,266.2031,158.8855,254.2031" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="206.2275" y="288.4136">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="86.6841" x="158.8855" y="270.0112">Return to start?</text><polygon fill="#F1F1F1" points="202.2275,356.5742,214.2275,368.5742,202.2275,380.5742,190.2275,368.5742,202.2275,356.5742" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="260.2168" x="72.1191" y="400.5742"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.2168" x="82.1191" y="421.7129">Initialize aggregated distance, duration,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="230.8184" x="82.1191" y="435.6816">legs, provider responses and polylines</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="268.8945" x="67.7803" y="524.2222"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.4453" x="77.7803" y="545.3608">Take at most 12 points</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.8945" x="77.7803" y="559.3296">(origin + 10 intermediates + destination)</text><path d="M339.2314,582.1597 L339.2314,605.8589 L319.2314,609.8589 L339.2314,613.8589 L339.2314,637.5581 A0,0 0 0 0 339.2314,637.5581 L639.103,637.5581 A0,0 0 0 0 639.103,637.5581 L639.103,592.1597 L629.103,582.1597 L339.2314,582.1597 A0,0 0 0 0 339.2314,582.1597" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M629.103,582.1597 L629.103,592.1597 L639.103,592.1597 L629.103,582.1597" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.4028" x="345.2314" y="599.2266">No waypoint optimization.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.7397" x="345.2314" y="614.3594">No live-traffic routing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.8716" x="345.2314" y="629.4922">Toll avoidance is forwarded when enabled.</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="234.0078" x="85.2236" y="592.8745"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.0078" x="95.2236" y="614.0132">Request an in-order economy route</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="322.4551" x="41" y="657.5581"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="302.4551" x="51" y="678.6968">Append section legs, totals, response and polyline</text><path d="M336.8877,708.3784 L336.8877,724.5112 L316.8877,728.5112 L336.8877,732.5112 L336.8877,748.644 A0,0 0 0 0 336.8877,748.644 L678.7998,748.644 A0,0 0 0 0 678.7998,748.644 L678.7998,718.3784 L668.7998,708.3784 L336.8877,708.3784 A0,0 0 0 0 336.8877,708.3784" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M668.7998,708.3784 L668.7998,718.3784 L678.7998,718.3784 L668.7998,708.3784" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.6929" x="342.8877" y="725.4453">The previous destination becomes the next</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.9121" x="342.8877" y="740.5781">origin, so adjacent sections overlap by one point.</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="229.3203" x="87.5674" y="711.5269"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.3203" x="97.5674" y="732.6655">Advance to the section destination</text><polygon fill="#F1F1F1" points="89.9421,468.5117,314.5129,468.5117,326.5129,480.5117,314.5129,492.5117,89.9421,492.5117,77.9421,480.5117,89.9421,468.5117" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="206.2275" y="502.7222">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="224.5708" x="89.9421" y="484.3198">At least two unprocessed points remain?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="64.2405" y="477.9175">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.3633" x="45.0459" y="790.644"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.3633" x="55.0459" y="811.7827">Store one route_plan, all stops, aggregate totals,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.8691" x="55.0459" y="825.7515">and multiple encoded polylines</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="350.832" x="26.8115" y="858.5815"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.832" x="36.8115" y="879.7202">Render the complete route as connected road sections</text><ellipse cx="202.2275" cy="923.5503" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="202.2275" cy="923.5503" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="202.2275" x2="202.2275" y1="72.2969" y2="92.2969"/><polygon fill="#181818" points="198.2275,82.2969,202.2275,92.2969,206.2275,82.2969,202.2275,86.2969" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="202.2275" x2="202.2275" y1="126.2656" y2="146.2656"/><polygon fill="#181818" points="198.2275,136.2656,202.2275,146.2656,206.2275,136.2656,202.2275,140.2656" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="202.2275" x2="202.2275" y1="180.2344" y2="200.2344"/><polygon fill="#181818" points="198.2275,190.2344,202.2275,200.2344,206.2275,190.2344,202.2275,194.2344" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="202.2275" x2="202.2275" y1="278.2031" y2="302.6055"/><polygon fill="#181818" points="198.2275,292.6055,202.2275,302.6055,206.2275,292.6055,202.2275,296.6055" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="257.5696" x2="322.9912" y1="266.2031" y2="266.2031"/><polygon fill="#181818" points="318.9912,309.5898,322.9912,319.5898,326.9912,309.5898,322.9912,313.5898" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="322.9912" x2="322.9912" y1="266.2031" y2="368.5742"/><line style="stroke:#181818;stroke-width:1;" x1="322.9912" x2="214.2275" y1="368.5742" y2="368.5742"/><polygon fill="#181818" points="224.2275,364.5742,214.2275,368.5742,224.2275,372.5742,220.2275,368.5742" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter